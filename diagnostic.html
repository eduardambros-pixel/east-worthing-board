<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traini.ac Diagnostic</title>
<style>
body{background:#000;color:#ffb000;font:16px monospace;margin:16px}
h2{border-bottom:1px solid #ffb000;padding-bottom:6px}
pre{white-space:pre-wrap;word-break:break-word;background:#111;padding:10px}
button{font:18px monospace;padding:8px 16px;margin-bottom:12px}
.ok{color:#8f8}.err{color:#f88}
</style>
</head>
<body>
<button onclick="loadAll()">REFRESH ALL</button>
<div id="stamp"></div>

<h2>EWR — STATION ACTIVITY</h2>
<div id="ewr"></div>

<h2>PMH — DEPARTURES</h2>
<div id="pmh"></div>

<h2>HAV — DEPARTURES</h2>
<div id="hav"></div>

<script>
const BASE="https://api.traini.ac/api";

async function show(id,url){
  const el=document.getElementById(id);
  el.textContent="Loading...";
  try{
    const r=await fetch(url,{cache:"no-store"});
    const j=await r.json();
    el.innerHTML="<pre>"+escapeHtml(JSON.stringify(j,null,2))+"</pre>";
  }catch(e){
    el.innerHTML='<div class="err">'+escapeHtml(String(e))+"</div>";
  }
}
function escapeHtml(s){
  return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function loadAll(){
  document.getElementById("stamp").textContent="Refreshed: "+new Date().toLocaleTimeString("en-GB");
  show("ewr",`${BASE}/stations/EWR/activity?limit=30`);
  show("pmh",`${BASE}/departures/PMH?limit=20`);
  show("hav",`${BASE}/departures/HAV?limit=20`);
}
loadAll();
</script>
</body>
</html>
