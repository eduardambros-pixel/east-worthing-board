<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>East Worthing Departures</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#030303;color:#ffb000;overflow:hidden}
body{font-family:"Courier New",monospace;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(255,176,0,.55)}
#head{height:14%;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:2px solid #6b4900}
#station{font-size:clamp(28px,5vw,50px);font-weight:900;letter-spacing:.12em;white-space:nowrap}
#clock{font-size:clamp(23px,4vw,40px);font-weight:900;letter-spacing:.06em;white-space:nowrap}
#board{height:86%;display:flex;flex-direction:column}
.row{height:16.6667%;padding:.8vh 2.5vw;border-bottom:1px solid #443000;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.top{display:grid;grid-template-columns:15% 1fr 13%;column-gap:2vw;align-items:center;font-size:clamp(25px,4.5vw,45px);font-weight:900;line-height:1}
.time{white-space:nowrap}.dest{white-space:nowrap;overflow:hidden}.platform{text-align:right;white-space:nowrap;font-size:.82em}
.bottom{height:1.35em;margin-top:.75vh;font-size:clamp(14px,2.6vw,27px);line-height:1.2;white-space:nowrap;overflow:hidden}
.marquee-wrap{width:100%;overflow:hidden}.marquee{display:inline-block;min-width:max-content;padding-left:100%;animation:scroll 18s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.dim{opacity:.82}.err{padding:3vw;font-size:24px}
</style>
</head>
<body>
<header id="head"><div id="station">EAST WORTHING</div><div id="clock">--:--:--</div></header>
<main id="board"></main>
<script>
const API="https://api.traini.ac/api/departures/EWR?limit=8";
const board=document.getElementById("board"),clock=document.getElementById("clock");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function first(o,keys,def=""){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k]}return def}
function hhmm(v){const m=String(v??"").match(/(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,"0")+":"+m[2]:"--:--"}
function calling(x){const v=first(x,["calling_at","callingPoints","calling_points","callingpoints"],[]);if(typeof v==="string")return v;if(Array.isArray(v))return v.map(a=>typeof a==="string"?a:first(a,["name","location","station"],"")).filter(Boolean).join("  •  ");return ""}
function liveInfo(x){const b=[],c=first(x,["coaches","coach_count","coaches_count"],""),l=first(x,["last_location","lastLocation","location"],""),s=first(x,["status","message"],""),o=first(x,["operator","operator_name"],"");if(c)b.push(`${c} coaches`);if(l)b.push(`At ${l}`);if(!b.length&&s)b.push(s);if(!b.length&&o)b.push(o);return b.join("  ·  ")||"Live service"}
function extract(d){if(Array.isArray(d))return d;for(const k of["departures","services","data","results"])if(Array.isArray(d?.[k]))return d[k];return []}
function render(items){board.innerHTML=items.slice(0,6).map((x,i)=>{const t=first(x,["std","scheduled","departure","departure_time","time"],""),d=first(x,["destination","destination_name","to"],""),p=first(x,["platform","platform_name","plat"],""),calls=calling(x);const second=i<4&&calls?`<div class="marquee-wrap"><span class="marquee">${esc(calls)}</span></div>`:`<span class="dim">${esc(liveInfo(x))}</span>`;return `<section class="row"><div class="top"><div class="time">${esc(hhmm(t))}</div><div class="dest">${esc(d)}</div><div class="platform">${p?`PF ${esc(p)}`:""}</div></div><div class="bottom">${second}</div></section>`}).join("")}
async function load(){try{const r=await fetch(API,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);render(extract(await r.json()))}catch(e){if(!board.children.length)board.innerHTML='<div class="err">LIVE DATA UNAVAILABLE</div>'}}
function tick(){clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}
tick();setInterval(tick,1000);load();setInterval(load,60000);
</script>
</body></html>
