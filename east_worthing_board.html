<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>East Worthing Departures</title><style>html,body{margin:0;background:#050505;color:#ffb000;font-family:'Courier New',monospace}body{padding:10px;box-sizing:border-box}h1{font-size:24px;margin:0 0 2px;letter-spacing:1px}#sub{font-size:14px;margin-bottom:8px}.row{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;border-bottom:1px solid #332500;padding:5px 0;min-height:42px}.time{font-size:24px;font-weight:700}.dest{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;margin-top:2px}.plat{text-align:right;font-size:18px;font-weight:700}.cancel{color:#ff5555}#status{font-size:11px;margin-top:6px}</style></head><body><h1>EAST WORTHING</h1><div id="sub">DEPARTURES</div><div id="board">Loading…</div><div id="status"></div><script>
const API='https://api.traini.ac/api/departures/EWR?limit=15';
const hm=s=>s?new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'--:--';
async function load(){try{const r=await fetch(API,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);document.getElementById('board').innerHTML=d.results.filter(x=>x.service_class==='passenger').slice(0,10).map(x=>{let status=x.status==='cancelled'?'CANCELLED':(x.status_text||'');let t=x.expected_departs||x.departs;return `<div class="row ${x.status==='cancelled'?'cancel':''}"><div class="time">${hm(t)}</div><div><div class="dest">${x.destination?.name||''}</div><div class="meta">${x.operator||''}${status?' · '+status:''}</div></div><div class="plat">${x.platform||''}</div></div>`}).join('')||'<div class="row">No departures found</div>';document.getElementById('status').textContent='LIVE · Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('status').textContent='Live data unavailable: '+e.message}}load();setInterval(load,60000);
</script></body></html>
