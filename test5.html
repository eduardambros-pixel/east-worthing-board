<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>East Worthing Departures</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#030303;color:#ffb000;overflow:hidden}
body{font-family:"Courier New",monospace;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(255,176,0,.55)}
#head{height:14%;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:2px solid #6b4900}
#station{font-size:clamp(28px,5vw,50px);font-weight:900;letter-spacing:.12em;white-space:nowrap}
#clock{font-size:clamp(23px,4vw,40px);font-weight:900;letter-spacing:.06em;white-space:nowrap}
#board{height:86%;display:flex;flex-direction:column}
.row{height:16.6667%;padding:.7vh 2.2vw;border-bottom:1px solid #443000;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.top{display:grid;grid-template-columns:12% 25% 1fr auto auto;column-gap:1.5vw;align-items:center;font-size:clamp(20px,3.55vw,38px);font-weight:900;line-height:1}
.time,.dest,.where,.coaches,.status{white-space:nowrap}
.dest,.where{overflow:hidden;text-overflow:clip}
.where{font-size:.65em}
.coaches{font-size:.58em}
.status{font-size:.62em;text-align:right}
.bottom{height:1.35em;margin-top:.75vh;font-size:clamp(14px,2.45vw,25px);line-height:1.2;white-space:nowrap;overflow:hidden;position:relative}
.marquee{position:absolute;left:100%;display:inline-block;width:max-content;animation:scroll 22s linear infinite;will-change:transform}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(calc(-100% - 100vw))}}
.err{padding:3vw;font-size:24px}
</style>
</head>
<body>
<header id="head"><div id="station">EAST WORTHING</div><div id="clock">--:--:--</div></header>
<main id="board"></main>
<script>
const BASE="https://api.traini.ac/api";
const board=document.getElementById("board"),clock=document.getElementById("clock");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function hhmm(v){
  if(!v)return"--:--";
  const d=new Date(v);
  if(!isNaN(d))return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false});
  const m=String(v).match(/(\d{1,2}):(\d{2})/);
  return m?m[1].padStart(2,"0")+":"+m[2]:"--:--";
}
function calls(x){
  return (x.calling_points||[]).map(p=>p?.station?.name).filter(Boolean).join("  •  ");
}
function statusText(x,pos){
  const raw=String(x.status_text||pos?.variation_status||"").trim();
  if(/cancel/i.test(raw))return"CANCELLED";
  const mins=raw.match(/(\d+)\s*(?:min|minute)/i);
  if(mins && !/on time/i.test(raw))return `${mins[1]} min late`;
  if(/late|delay/i.test(raw) && pos?.variation!=null){
    const n=Math.round(Number(pos.variation)/60);
    if(n>0)return `${n} min late`;
  }
  if(/on time/i.test(raw))return"On time";
  return raw.replaceAll("_"," ")||"";
}
function render(rows,positions={}){
  board.innerHTML=rows.slice(0,6).map(x=>{
    const pos=positions[x.train_id];
    const where=pos?.last_location ? `At ${pos.last_location}` : "";
    const coach=x.coaches ? `${x.coaches} coaches` : "";
    const st=statusText(x,pos);
    const cp=calls(x);
    return `<section class="row">
      <div class="top">
        <div class="time">${esc(hhmm(x.departs))}</div>
        <div class="dest">${esc(x.destination?.name||"")}</div>
        <div class="where">${esc(where)}</div>
        <div class="coaches">${esc(coach)}</div>
        <div class="status">${esc(st)}</div>
      </div>
      <div class="bottom">${cp?`<span class="marquee">Calling at: ${esc(cp)}</span>`:""}</div>
    </section>`;
  }).join("");
}
async function getPosition(id){
  if(!id)return null;
  try{
    const r=await fetch(`${BASE}/train?train_id=${encodeURIComponent(id)}`,{cache:"no-store"});
    if(!r.ok)return null;
    const j=await r.json();
    return (j.results||[]).find(v=>v.last_location) || (j.results||[])[0] || null;
  }catch{return null}
}
async function load(){
  try{
    const r=await fetch(`${BASE}/departures/EWR?limit=6`,{cache:"no-store"});
    if(!r.ok)throw new Error();
    const j=await r.json(),rows=(j.results||[]).slice(0,6);
    render(rows);
    const positions={};
    await Promise.all(rows.map(async x=>{
      const p=await getPosition(x.train_id);
      if(p)positions[x.train_id]=p;
    }));
    render(rows,positions);
  }catch{
    if(!board.children.length)board.innerHTML='<div class="err">LIVE DATA UNAVAILABLE</div>';
  }
}
function tick(){clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}
tick();setInterval(tick,1000);
load();setInterval(load,60000);
</script>
</body>
</html>
