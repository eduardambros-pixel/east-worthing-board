<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>East Worthing Departures — Test 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#030303;color:#ffb000;overflow:hidden}
body{font-family:"Courier New",monospace;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(255,176,0,.55)}
#head{height:14%;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:2px solid #6b4900}
#station{font-size:clamp(28px,5vw,50px);font-weight:900;letter-spacing:.12em;white-space:nowrap}
#right{display:flex;align-items:center;gap:2vw}
#stale{font-size:clamp(10px,1.5vw,16px);opacity:.8}
#clock{font-size:clamp(23px,4vw,40px);font-weight:900;letter-spacing:.06em;white-space:nowrap}
#board{height:86%;display:flex;flex-direction:column}
.row{height:16.6667%;padding:.75vh 2.5vw;border-bottom:1px solid #443000;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.top{display:grid;grid-template-columns:14% 1fr 13%;column-gap:2.5vw;align-items:center;font-size:clamp(24px,4.4vw,44px);font-weight:900;line-height:1}
.time,.platform{white-space:nowrap}.dest{white-space:nowrap;overflow:hidden}.platform{text-align:right;font-size:.82em}
.bottom{height:1.35em;margin-top:.8vh;font-size:clamp(14px,2.55vw,26px);line-height:1.2;white-space:nowrap;overflow:hidden}
.marquee-wrap{width:100%;overflow:hidden}.marquee{display:inline-block;white-space:nowrap;padding-left:100%;animation:scroll 22s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.dim{opacity:.82}.late{font-weight:bold}.error{padding:3vw;font-size:24px}
</style>
</head>
<body>
<header id="head"><div id="station">EAST WORTHING</div><div id="right"><div id="stale"></div><div id="clock">--:--:--</div></div></header>
<main id="board"></main>
<script>
const API="https://api.traini.ac/api/departures/EWR?limit=8";
const board=document.getElementById("board"), clock=document.getElementById("clock"), stale=document.getElementById("stale");
let lastGood=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hhmm(v){
  if(!v)return "--:--";
  const d=new Date(v);
  if(!isNaN(d))return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false});
  const m=String(v).match(/(\d{1,2}):(\d{2})/); return m?m[1].padStart(2,"0")+":"+m[2]:"--:--";
}
function callList(x){
  const seen=new Set(), out=[];
  for(const cp of (x.calling_points||[])){
    const name=cp?.station?.name;
    if(name && !seen.has(name)){seen.add(name);out.push(name.replace(/\s+\([^)]*\)$/,""))}
  }
  return out.join("  •  ");
}
function info(x){
  const bits=[];
  if(x.coaches)bits.push(`${x.coaches} coaches`);
  if(x.status_text)bits.push(x.status_text);
  else if(Number(x.lateness_minutes)>0)bits.push(`${x.lateness_minutes} min late`);
  if(x.operator)bits.push(x.operator);
  return bits.join("  ·  ");
}
function render(items){
  board.innerHTML=items.slice(0,6).map((x,i)=>{
    const calls=callList(x);
    const second=(i<4 && calls)
      ? `<div class="marquee-wrap"><span class="marquee">Calling at: ${esc(calls)}</span></div>`
      : `<span class="dim">${esc(info(x))}</span>`;
    return `<section class="row">
      <div class="top">
        <div class="time">${esc(hhmm(x.departs))}</div>
        <div class="dest">${esc(x.destination?.name||"")}</div>
        <div class="platform">${x.platform?`PF ${esc(x.platform)}`:""}</div>
      </div>
      <div class="bottom">${second}</div>
    </section>`;
  }).join("");
}
async function load(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!Array.isArray(d.results))throw new Error("No results");
    lastGood=d.results;
    render(lastGood);
    stale.textContent="";
  }catch(e){
    if(lastGood){
      render(lastGood);
      stale.textContent="LIVE DATA TEMPORARILY UNAVAILABLE";
    }else{
      board.innerHTML='<div class="error">LIVE DATA UNAVAILABLE</div>';
    }
  }
}
function tick(){clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}
tick();setInterval(tick,1000);
load();setInterval(load,60000);
</script>
</body>
</html>
