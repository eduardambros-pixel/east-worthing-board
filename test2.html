<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>East Worthing Departures</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#030303;color:#ffb000;overflow:hidden}
body{font-family:"Courier New",monospace;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(255,176,0,.55)}
#head{height:14%;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:2px solid #6b4900}
#station{font-size:clamp(28px,5vw,50px);font-weight:900;letter-spacing:.12em;white-space:nowrap}
#clock{font-size:clamp(23px,4vw,40px);font-weight:900;letter-spacing:.06em;white-space:nowrap}
#board{height:86%;display:flex;flex-direction:column}
.row{height:16.6667%;padding:.75vh 2.5vw;border-bottom:1px solid #443000;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.top{display:grid;grid-template-columns:14% 1fr auto 11%;column-gap:1.8vw;align-items:center;font-size:clamp(23px,4.2vw,43px);font-weight:900;line-height:1}
.time,.dest,.coaches,.platform{white-space:nowrap}.dest{overflow:hidden}.coaches{font-size:.60em}.platform{text-align:right;font-size:.82em}
.bottom{height:1.35em;margin-top:.8vh;font-size:clamp(14px,2.55vw,26px);line-height:1.2;white-space:nowrap;overflow:hidden}
.marquee{display:inline-block;padding-left:100%;min-width:max-content;animation:scroll 22s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.dim{opacity:.82}.err{padding:3vw;font-size:24px}
</style>
</head>
<body>
<header id="head"><div id="station">EAST WORTHING</div><div id="clock">--:--:--</div></header>
<main id="board"></main>
<script>
const API="https://api.traini.ac/api";
const board=document.getElementById("board"), clock=document.getElementById("clock");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm=v=>{if(!v)return"--:--";const d=new Date(v);return isNaN(d)?String(v).slice(11,16):d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false})};

function callNames(x){
  return (x.calling_points||[]).map(p=>p?.station?.name).filter(Boolean).join("  •  ");
}
function render(rows, locations={}){
  board.innerHTML=rows.slice(0,6).map((x,i)=>{
    const calls=callNames(x);
    const coaches=x.coaches ? `${x.coaches} coaches` : "";
    let second="";
    if(i<4){
      second=calls ? `<span class="marquee">Calling at: ${esc(calls)}</span>` : `<span class="dim">${esc(x.status_text||"")}</span>`;
    } else {
      const pos=locations[x.train_id];
      if(pos?.last_location){
        const state=pos.variation_status ? pos.variation_status.replaceAll("_"," ") : "";
        second=`<span class="dim">${esc(x.status_text||state)}${x.status_text||state ? "  •  " : ""}Last reported: ${esc(pos.last_location)}</span>`;
      } else {
        second=`<span class="dim">${esc(x.status_text||"No live location yet")}</span>`;
      }
    }
    return `<section class="row">
      <div class="top">
        <div class="time">${esc(hhmm(x.departs))}</div>
        <div class="dest">${esc(x.destination?.name||"")}</div>
        <div class="coaches">${esc(coaches)}</div>
        <div class="platform">${x.platform ? "PF "+esc(x.platform) : ""}</div>
      </div>
      <div class="bottom">${second}</div>
    </section>`;
  }).join("");
}
async function trainLocation(trainId){
  if(!trainId)return null;
  try{
    const r=await fetch(`${API}/train?train_id=${encodeURIComponent(trainId)}`,{cache:"no-store"});
    if(!r.ok)return null;
    const j=await r.json();
    return (j.results||[]).find(v=>v.last_location)||null;
  }catch{return null}
}
async function load(){
  try{
    const r=await fetch(`${API}/departures/EWR?limit=6`,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json(), rows=(j.results||[]).slice(0,6);
    render(rows);
    const locs={};
    for(const x of rows.slice(4,6)){
      const p=await trainLocation(x.train_id);
      if(p)locs[x.train_id]=p;
    }
    render(rows,locs);
  }catch(e){
    if(!board.children.length)board.innerHTML='<div class="err">LIVE DATA UNAVAILABLE</div>';
  }
}
function tick(){clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}
tick();setInterval(tick,1000);load();setInterval(load,60000);
</script>
</body>
</html>
