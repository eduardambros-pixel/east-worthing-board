<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lluc | Journey tracker</title><style>@import url('https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050505;color:#ffb000;font:900 clamp(16px,2.6vw,29px) Doto,monospace}body{display:flex;flex-direction:column}header{height:19%;border-bottom:2px solid #684800;display:flex;align-items:center;justify-content:space-between;padding:0 3vw}h1{font-size:clamp(19px,3.7vw,40px);margin:0}#clock{font-size:clamp(19px,3.5vw,37px)}main{flex:1;display:flex;flex-direction:column;min-height:0}.leg{flex:1;min-height:0;padding:1vh 3vw;border-bottom:1px solid #684800;display:flex;flex-direction:column;justify-content:space-evenly}.route{display:flex;justify-content:space-between;gap:2vw;font-size:clamp(17px,3vw,32px)}.detail{color:#ffd47b;font-size:clamp(17px,2.8vw,30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:clamp(14px,2.3vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer{min-height:18%;padding:1vh 3vw;display:flex;flex-direction:column;justify-content:space-around;font-size:clamp(13px,2vw,22px)}.warn{color:#ff776d}.dim{color:#ae8a50}</style></head><body><header><h1>LLUC · BRI → WRH</h1><div style="text-align:right"><div id="clock">--:--:--</div><div id="feedhealth" class="dim" style="font-size:clamp(12px,1.8vw,19px)">CONNECTING</div></div></header><main><section class="leg"><div class="route"><span>18:22 BRISTOL</span><span>20:04 SOUTHAMPTON</span></div><div id="where1" class="detail">AWAITING LIVE TRAIN</div><div id="status1" class="status dim">Booked service · Friday 16 October</div></section><section class="leg"><div class="route"><span>20:50 SOUTHAMPTON</span><span>22:14 EAST WORTHING</span></div><div id="where2" class="detail">AWAITING LIVE TRAIN</div><div id="status2" class="status dim">Booked service · Friday 16 October</div></section><footer><div id="connection">CONNECTION: 46 MIN SCHEDULED</div><div id="updated" class="dim">Checking railway feed · 30 sec refresh</div></footer></main><script>
'use strict';
const BASE='https://api.traini.ac/api',DAY='2026-10-16';
const $=id=>document.getElementById(id);
function ukTime(d,seconds=false){return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{})}).format(d);}
function clock(){ $('clock').textContent=ukTime(new Date(),true); }clock();setInterval(clock,1000);
function health(s,bad){$('feedhealth').textContent=s;$('feedhealth').className=bad?'warn':'dim';}
function hhmm(v){if(!v)return '';const d=new Date(v);return isNaN(+d)?String(v).match(/\d\d:\d\d/)?.[0]||'':ukTime(d);}
function scheduled(x){return hhmm(x.departs);}
function stopsAt(x,crs){return (x.calling_points||[]).some(p=>p.station?.crs===crs);}
function label(x){return String(x.status_text||x.status||'STATUS NOT REPORTED').replace(/_/g,' ');}
async function get(url,timeout=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t);}}
async function board(crs){const j=await get(`${BASE}/departures/${crs}?limit=30`);if(!Array.isArray(j.results))throw Error('Invalid '+crs+' feed');return j.results;}
async function position(x){if(!x?.train_id)return '';try{const j=await get(`${BASE}/train?train_id=${encodeURIComponent(x.train_id)}`,7000);const p=(j.results||[]).find(v=>v.last_location)||(j.results||[])[0];return String(p?.last_location||'').trim();}catch{return '';}}
function choose(rows,time,via){return rows.filter(x=>scheduled(x)===time&&x.service_class!=='bus').sort((a,b)=>Number(via(b))-Number(via(a)))[0]||null;}
function arrivalAt(x,crs){const p=(x?.calling_points||[]).find(p=>p.station?.crs===crs);return p?.expected||p?.scheduled||(crs==='SOU'?x?.arrives:null);}
function display(n,x,pos,available){if(!x){$('where'+n).textContent=available?'BOOKED TRAIN NOT YET IN FEED':'LIVE FEED UNAVAILABLE';$('status'+n).textContent=available?'RECHECKING AUTOMATICALLY':'RETRYING';return;}$('where'+n).textContent=pos?'LAST REPORTED: '+pos.toUpperCase():'LOCATION NOT YET REPORTED';$('status'+n).textContent=label(x).toUpperCase()+(x.platform?' · PLATFORM '+x.platform:'');}
let busy=false,firstId='',secondId='';
async function refresh(){if(busy)return;busy=true;const checks=await Promise.allSettled([board('BRI'),board('SOU')]);try{
const a=checks[0].status==='fulfilled',b=checks[1].status==='fulfilled';const bri=a?checks[0].value:[],sou=b?checks[1].value:[];
const first=a?choose(bri,'18:22',x=>stopsAt(x,'SOU')):null;
const second=b?choose(sou,'20:50',x=>stopsAt(x,'EWR')||stopsAt(x,'WRH')):null;
if(first?.train_id)firstId=first.train_id;if(second?.train_id)secondId=second.train_id;
const [p1,p2]=await Promise.all([position(first),position(second)]);
display(1,first,p1,a);display(2,second,p2,b);
health(!a&&!b?'OFFLINE · RETRYING':!a||!b?'PARTIAL FEED':first||second?'LIVE · FEED OK':'WAITING · FEED OK',!a||!b);
let note='CONNECTION: 46 MIN SCHEDULED',danger=false;
if(first&&/cancel/i.test(label(first))){note='BRISTOL TRAIN CANCELLED';danger=true;}
else if(second&&/cancel/i.test(label(second))){note='20:50 TRAIN CANCELLED';danger=true;}
else if(first){const eta=arrivalAt(first,'SOU');if(eta){const mins=Math.floor((Date.parse(DAY+'T20:50:00+01:00')-Date.parse(eta))/60000);if(Number.isFinite(mins)){note=mins<0?'20:50 CONNECTION LIKELY MISSED':'CONNECTION: ~'+mins+' MIN (ESTIMATED)';danger=mins<10;}}}
if(danger&&b){const later=sou.filter(x=>scheduled(x)>'20:50'&&(stopsAt(x,'WRH')||stopsAt(x,'EWR'))).sort((x,y)=>scheduled(x).localeCompare(scheduled(y)))[0];if(later)note+=' · NEXT '+scheduled(later)+' TO WORTHING AREA';else note+=' · NO VERIFIED LATER DIRECT TRAIN IN FEED';}
$('connection').textContent=note;$('connection').className=danger?'warn':'';
$('updated').textContent='CHECKED '+ukTime(new Date(),true)+' · BRI '+(a?'OK':'ERROR')+' / SOU '+(b?'OK':'ERROR')+' · REFRESH 30S';$('updated').className=!a||!b?'warn':'dim';
}catch(e){health('TRACKER ERROR',true);$('updated').textContent='ERROR: '+e.message;$('updated').className='warn';}finally{busy=false;}}
refresh();setInterval(refresh,30000);
</script></body></html>
